# Render Blueprint: free, PUBLIC, DRY-RUN demo.
# JOBPAY_FORCE_DRY_RUN=true makes the app ignore any PayPal credentials, so the public URL can never
# spend sandbox balances or email anyone. Never add PayPal keys to a public service.
services:
  - type: web
    name: jobpay-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JOBPAY_FORCE_DRY_RUN
        value: "true"
      - key: PAYPAL_MODE
        value: sandbox
      - key: RATE_LIMIT_PER_MIN
        value: "60"
